<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <title>Pokedex</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="container">
    <!------ LEFT SIDE ------>
    <div id="left-side">
        <!-- Rounded bordure left -->
        <div id="round-bordure-left-side"></div>
        <div id="round-bordure-left-side2"></div>
        <!-- Top left lights -->
        <div id="big-blue-light-background" class="light">
            <div id="big-blue-light" class="light"></div>
            <div id="big-blue-light-glint" class="light"></div>
        </div>
        <div id="little-lights">
            <div class="light little-light red-light"></div>
            <div class="light little-light yellow-light"></div>
            <div class="light little-light green-light"></div>
        </div>
        <!-- Left side big screen with red lights -->
        <div id="screen-left-background">
            <div id="screen-left-little-lights">
                <div class="screen-left-little-red-light light"></div>
                <div class="screen-left-little-red-light light"></div>
            </div>
            <!-- Screen for the Pokemon images -->
            <div id="screen-left">
                <img id="screen-left-image" src="profesor.svg" alt="">
            </div>
            <div id="screen-left-big-red-light" class="light"></div>
            <div id="screen-left-burger">
                <div id="screen-left-burger-inside"></div>
            </div>
        </div>
        <!-- Console -->
        <div id="elongated-buttons">
            <div class="elongated-button elongated-button1 clickable" onclick="limpiarNumero()"></div>
            <div class="elongated-button elongated-button2 clickable" onclick="irAlInicio()"></div>
        </div>
        <div id="rounded-button" class="clickable" onclick="buscarPokemon()"></div>
        <div id="screen-left-little">
            <p>Altura: <span id="pokemon-height"></span></p>
            <p>Peso: <span id="pokemon-weight"></span></p>
            <p id="numero-pantalla" style="text-align: center; font-weight: bold; margin-top: 10px; min-height: 20px;">Número: </p>
        </div>
        <!-- Cross used to choose the Pokemon -->
        <div id="cross">
            <div class="cross cross-top clickable" onclick="asignarNumero(this)">
                <div class="arrow arrow-top"></div>
            </div>
            <div class="cross cross-mid"></div>
            <div class="cross cross-bottom clickable" onclick="asignarNumero(this)">
                <div class="arrow arrow-bottom"></div>
            </div>
            <div class="cross cross-left clickable" onclick="rotarIzquierda()">
                <div class="arrow arrow-left"></div>
            </div>
            <div class="cross cross-right clickable" onclick="rotarDerecha()">
                <div class="arrow arrow-right"></div>
            </div>
        </div>
    </div>

    <!------ MIDDLE ------>
    <!-- Bindings -->
    <div class="binding">
        <div class="hinge hinge1"></div>
        <div class="hinge hinge2"></div>
        <div class="hinge hinge3"></div>
    </div>

    <!------ RIGHT SIDES ------>
    <div id="right-side">
        <!-- Rounded bordure right -->
        <div id="round-bordure-right-side"></div>
        <!-- Right side screen -->
        <div id="screen-right">
            <p id="pokemon-numero-p">Número: <span id="pokemon-numero"></span></p>
            <p id="pokemon-title-p">Nombre: <span id="pokemon-title"></span></p>
            <p id="pokemon-hp-p" class="pokemon-stats-left">Hp : <span id="pokemon-hp"></span></p>
            <p id="pokemon-attack-p" class="pokemon-stats-right">Ataque : <span id="pokemon-attack"></span></p>
            <p id="pokemon-defense-p" class="pokemon-stats-left">Defensa : <span id="pokemon-defense"></span></p>
            <p id="pokemon-speed-p" class="pokemon-stats-right">Velocidad : <span id="pokemon-speed"></span></p>

        </div>
        <!-- Right side keyboard -->
        <div id="keyboard">
            <button class="key clickable" onclick="asignarNumero(this)">1</button>
            <button class="key clickable" onclick="asignarNumero(this)">2</button>
            <button class="key clickable" onclick="asignarNumero(this)">3</button>
            <button class="key clickable" onclick="asignarNumero(this)">4</button>
            <button class="key clickable" onclick="asignarNumero(this)">5</button>
            <button class="key clickable" onclick="asignarNumero(this)">6</button>
            <button class="key clickable" onclick="asignarNumero(this)">7</button>
            <button class="key clickable" onclick="asignarNumero(this)">8</button>
            <button class="key clickable" onclick="asignarNumero(this)">9</button>
            <button class="key clickable" onclick="asignarNumero(this)">0</button>
        </div>
        <!-- Right elongated lights -->
        <div id="elongated-lights">
            <div class="key light"></div>
            <div class="key light"></div>
        </div>
        <!-- Right side yellow light -->
        <button id="right-side-yellow-light" class="key light"></button>
        <!-- Right side white buttons -->
        <div id="white-buttons">
            <button class="key clickable" onclick="buscarPokemon()">Buscar</button>
            <button class="key clickable" onclick="agregarPokemon()">Agregar</button>
        </div>
        <!-- Right side grey buttons -->
        <div id="grey-buttons">
            <div class="key">
                <p id="pokemon-type-1"></p>
            </div>
            <div class="key">
                <p id="pokemon-type-2"></p>
            </div>
        </div>
    </div>
</div>
<br>
<br>

<!-- DESPLEGABLE DE POKÉMON AGREGADOS -->
<div id="dropdown-pokemones">
    <button id="toggle-pokemones" class="toggle-btn" onclick="toggleDropdown()">
        🎮 Pokémon Capturados
    </button>
    <div id="contenido-dropdown" class="dropdown-content">
        <table class="tabla-pokemones">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nombre</th>
                    <th>HP</th>
                    <th>Def</th>
                    <th>Vel</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="contenido-tabla">
            </tbody>
        </table>
    </div>
</div>

<table border="1">
    <thead>
        <tr>
            <td>No</td>
            <td>Nombre</td>
            <td>Hp</td>
            <td>Defensa</td>
            <td>Velocidad</td>
            <td>Acciones</td>
        </tr>
    </thead>
    <tbody id="contenido-tabla-antigua">

    </tbody>
</table>
<br>
<div id="modal" class="modal">
    <div class="modal-content">
        <input id="index" type="hidden">
        <label>Nombre</label>
        <br>
        <input id="nombre_editar">
        <br>
        <button onclick="cerrarModal()">Cancelar</button>
        <button onclick="editarPokemon()">Guardar</button>
    </div>
</div>

<!-- MODAL DE BATALLA -->
<div id="modal-batalla" class="modal">
    <div class="modal-batalla-content">
        <h2 style="text-align: center; color: #dd0b2d;">⚡ BATALLA POKÉMON ⚡</h2>
        
        <div class="batalla-container">
            <!-- Pokémon 1 -->
            <div class="pokemon-batalla">
                <div id="batalla-pokemon1-info">
                    <h3 id="batalla-p1-nombre"></h3>
                    <img id="batalla-p1-imagen" src="" alt="">
                    <p>HP: <span id="batalla-p1-hp"></span></p>
                    <p>ATK: <span id="batalla-p1-atk"></span></p>
                    <p>DEF: <span id="batalla-p1-def"></span></p>
                    <p>VEL: <span id="batalla-p1-vel"></span></p>
                </div>
            </div>

            <!-- VS -->
            <div class="batalla-vs">VS</div>

            <!-- Pokémon 2 -->
            <div class="pokemon-batalla">
                <div id="batalla-pokemon2-info">
                    <h3 id="batalla-p2-nombre"></h3>
                    <img id="batalla-p2-imagen" src="" alt="">
                    <p>HP: <span id="batalla-p2-hp"></span></p>
                    <p>ATK: <span id="batalla-p2-atk"></span></p>
                    <p>DEF: <span id="batalla-p2-def"></span></p>
                    <p>VEL: <span id="batalla-p2-vel"></span></p>
                </div>
            </div>
        </div>

        <!-- fin modal-batalla removido -->
    </div>
</div>

<script src="./general.js"></script>
</body>
</html>
